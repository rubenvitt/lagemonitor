name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Läufe je Ref ganz hintereinander, damit ein älterer Lauf nicht nach einem neueren
# deployt. PR-Läufe dürfen sich gegenseitig abbrechen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rubenvitt/lagemonitor

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Toolchain-Version steht in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.10.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: CI=1 scripts/check.sh

  image:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # fuekw-server holt das Deployment selbst ab (Poller, kein eingehender Zugang nötig).
  # Server-Seite und Einrichtung: rubenvitt/fuekw-deploy
  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      deployments: write
    concurrency:
      group: deploy-lagemonitor-production
      cancel-in-progress: false
    steps:
      - name: Deployment anlegen und auf fuekw-server warten
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.image.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          [ -n "$DIGEST" ] || { echo "::error::Image-Job hat keinen Digest geliefert"; exit 1; }
          api="repos/$GITHUB_REPOSITORY/deployments"
          id=$(jq -n --arg ref "$GITHUB_SHA" --arg image "$IMAGE@$DIGEST" \
                 '{ref: $ref, environment: "production", task: "deploy-compose", auto_merge: false,
                   required_contexts: [], payload: {image: $image}, description: "lagemonitor auf fuekw-server"}' \
               | gh api "$api" --input - --jq .id)
          echo "Deployment $id: $IMAGE@$DIGEST"
          last=""
          for _ in $(seq 60); do
            status=$(gh api "$api/$id/statuses?per_page=1" --jq '.[0] | "\(.state // "pending") \(.description // "")"') \
              || { sleep 10; continue; }
            [ "$status" = "$last" ] || echo "$status"
            last=$status
            case "${status%% *}" in
              success) exit 0 ;;
              failure|error|inactive) echo "::error::${status#* }"; exit 1 ;;
            esac
            sleep 10
          done
          # Als error markieren, damit der Server den veralteten Auftrag nicht später noch ausführt.
          gh api "$api/$id/statuses" -f state=error -f description="Zeitüberschreitung: kein Status von fuekw-server" >/dev/null
          echo "::error::fuekw-server hat nicht reagiert – läuft deploy-poller, ist das Token abgelaufen? (journalctl -u deploy-poller)"
          exit 1
