name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Läufe je Ref ganz hintereinander, damit ein älterer Lauf nicht nach einem neueren
# deployt. PR-Läufe dürfen sich gegenseitig abbrechen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rubenvitt/lagemonitor

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Toolchain-Version steht in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.10.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.7.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: CI=1 scripts/check.sh

  # amd64 (FüKw) und arm64 (iuk-services, Cloud-Instanz) bauen nativ nebeneinander, ohne Emulation
  # (Vorbild Suchlage `release.yml`). Der Job `image` fasst beide unter einem Tag zusammen; Docker
  # holt am Host dann die passende Architektur.
  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Nur für die Labels; die Tags setzt der Job `image`.
      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # PRs bauen nur zur Probe; geschoben wird allein von main.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Digest merken
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - name: Beide Architekturen unter einem Tag
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      # Der Digest des Index: Der FüKw zieht darüber amd64, die Cloud-Instanz arm64.
      - name: Digest des Index
        id: index
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          tag="$IMAGE:sha-${GITHUB_SHA::7}"
          docker buildx imagetools inspect "$tag" --format '{{ json .Manifest }}' > /tmp/index.json
          jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' /tmp/index.json | sort -u | tee /tmp/platforms
          grep -qx linux/amd64 /tmp/platforms
          grep -qx linux/arm64 /tmp/platforms
          echo "digest=$(jq -r .digest /tmp/index.json)" >> "$GITHUB_OUTPUT"

  # fuekw-server holt das Deployment selbst ab (Poller, kein eingehender Zugang nötig).
  # Server-Seite und Einrichtung: rubenvitt/fuekw-deploy
  # Die Cloud-Instanz auf iuk-services braucht hier nichts: Sie folgt `:latest` mit einem eigenen
  # Poller am Server (deploy/cloud/README.md).
  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      deployments: write
    concurrency:
      group: deploy-lagemonitor-production
      cancel-in-progress: false
    steps:
      - name: Deployment anlegen und auf fuekw-server warten
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.image.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          [ -n "$DIGEST" ] || { echo "::error::Image-Job hat keinen Digest geliefert"; exit 1; }
          api="repos/$GITHUB_REPOSITORY/deployments"
          id=$(jq -n --arg ref "$GITHUB_SHA" --arg image "$IMAGE@$DIGEST" \
                 '{ref: $ref, environment: "production", task: "deploy-compose", auto_merge: false,
                   required_contexts: [], payload: {image: $image}, description: "lagemonitor auf fuekw-server"}' \
               | gh api "$api" --input - --jq .id)
          echo "Deployment $id: $IMAGE@$DIGEST"
          last=""
          for _ in $(seq 60); do
            status=$(gh api "$api/$id/statuses?per_page=1" --jq '.[0] | "\(.state // "pending") \(.description // "")"') \
              || { sleep 10; continue; }
            [ "$status" = "$last" ] || echo "$status"
            last=$status
            case "${status%% *}" in
              success) exit 0 ;;
              failure|error|inactive) echo "::error::${status#* }"; exit 1 ;;
            esac
            sleep 10
          done
          # Als error markieren, damit der Server den veralteten Auftrag nicht später noch ausführt.
          gh api "$api/$id/statuses" -f state=error -f description="Zeitüberschreitung: kein Status von fuekw-server" >/dev/null
          echo "::error::fuekw-server hat nicht reagiert – läuft deploy-poller, ist das Token abgelaufen? (journalctl -u deploy-poller)"
          exit 1
