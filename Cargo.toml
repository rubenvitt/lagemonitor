[package]
name = "lagemonitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
default-run = "lagemonitor"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
# SQLite ist eingebacken: ein SQLite-CVE schließt nur ein Crate-Bump.
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls", "stream"] }
# Anmeldung (Pocket ID): Zufall für Sitzung, State und PKCE.
getrandom = "0.4"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
rust-embed = "8"
mime_guess = "2"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "catch-panic"] }
ts-rs = "12"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"

[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
